<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hosts — Create Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 移动优化：避免全局 transition，增强触摸目标 */
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .touchable { padding: .6rem .75rem; border-radius: .6rem; }
    .search-shadow { box-shadow: 0 1px 0 rgba(0,0,0,0.03) inset; }
    .bottom-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <div class="max-w-lg mx-auto min-h-screen flex flex-col">
    <!-- Top bar -->
    <header class="pt-4 pb-2 px-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button aria-label="Back" id="btnBack" class="text-gray-700 hover:bg-gray-100 rounded-full p-2 touchable">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-lg font-medium">Hosts</h1>
      </div>
      <button id="btnAdd" aria-label="Add host" class="text-gray-700 hover:bg-gray-100 rounded-full p-2 touchable">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </button>
    </header>

    <!-- Search -->
    <div class="px-4">
      <label class="sr-only" for="search">Search hosts</label>
      <div class="mt-2">
        <div class="flex items-center bg-white rounded-lg px-3 py-2 search-shadow border border-gray-200">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8"/></svg>
          <input id="search" type="search" placeholder="Search" class="flex-1 ml-3 outline-none text-sm text-gray-700" />
        </div>
      </div>
    </div>

    <!-- Main content -->
    <main class="flex-1 flex flex-col items-center justify-start px-6 pt-12 pb-6">
      <div class="w-36 h-36 rounded-xl bg-white shadow flex items-center justify-center mb-6">
        <svg class="w-10 h-10 text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="4" width="18" height="6" rx="2" ry="2"></rect>
          <rect x="3" y="14" width="18" height="6" rx="2" ry="2"></rect>
          <path d="M8 8h.01M16 8h.01M8 18h.01M16 18h.01"></path>
        </svg>
      </div>

      <h2 class="text-2xl font-semibold mb-2">Create Host</h2>
      <p class="text-center text-sm text-gray-500 mb-6 px-6">Save your connection details as hosts to connect in one click.</p>

      <form id="hostForm" class="w-full max-w-md">
        <label class="sr-only" for="hostInput">IP or hostname</label>
        <input id="hostInput" type="text" placeholder="Type IP address or hostname" aria-label="IP or hostname"
               class="w-full mb-4 px-4 py-3 rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <button id="btnContinue" type="submit" disabled
                class="w-full bg-blue-500 disabled:opacity-60 text-white py-3 rounded-full text-sm font-medium hover:bg-blue-600 transition-colors touchable">
          Continue
        </button>
      </form>

      <button id="btnDiscover" class="mt-4 text-blue-600 text-sm hover:underline touchable">Discover local devices</button>

      <!-- Discovered hosts list -->
      <div id="discovered" class="mt-6 w-full max-w-md hidden">
        <div class="bg-white rounded-lg shadow divide-y divide-gray-100 overflow-hidden">
          <div class="px-4 py-3 text-sm text-gray-600">Discovered devices</div>
          <div id="discoveredList" class="px-4 py-2 space-y-2"></div>
        </div>
      </div>
    </main>

    <!-- Bottom nav -->
    <nav class="border-t border-gray-200 bg-white px-4 py-3 bottom-safe">
      <div class="max-w-lg mx-auto flex justify-between items-center">
        <button class="flex flex-col items-center text-xs text-gray-700 touchable">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16v12H4z"/></svg>
          <span>Vaults</span>
        </button>

        <button class="flex flex-col items-center text-xs text-blue-600 touchable">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 9h8M8 13h8"/></svg>
          <span>Connections</span>
        </button>

        <button class="flex flex-col items-center text-xs text-gray-700 touchable">
          <svg class="w-6 h-6 mb-1 rounded-full bg-purple-100 p-1" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/></svg>
          <span>Profile</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    // 保持原有逻辑，主要微调以提高移动端响应
    const hostInput = document.getElementById('hostInput');
    const btnContinue = document.getElementById('btnContinue');
    const hostForm = document.getElementById('hostForm');
    const btnDiscover = document.getElementById('btnDiscover');
    const discovered = document.getElementById('discovered');
    const discoveredList = document.getElementById('discoveredList');

    hostInput.addEventListener('input', () => {
      btnContinue.disabled = hostInput.value.trim().length === 0;
    });

    hostForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = hostInput.value.trim();
      if (!value) return;
      const hosts = JSON.parse(localStorage.getItem('hosts') || '[]');
      hosts.unshift({ id: Date.now(), host: value });
      localStorage.setItem('hosts', JSON.stringify(hosts));
      hostInput.value = '';
      btnContinue.disabled = true;
      // 改用非阻塞提示
      const toast = document.createElement('div');
      toast.textContent = '✅ Host saved: ' + value;
      toast.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 bg-black/80 text-white px-4 py-2 rounded';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    });

    btnDiscover.addEventListener('click', async () => {
      discoveredList.innerHTML = '';
      discovered.classList.remove('hidden');
      const sims = [
        { host: '192.168.1.10', name: 'raspberrypi' },
        { host: '192.168.1.22', name: 'nas.local' },
        { host: '192.168.1.45', name: 'dev-machine' }
      ];
      discoveredList.innerHTML = '<div class="py-3 text-sm text-gray-500">Scanning...</div>';
      await new Promise(r => setTimeout(r, 800));
      discoveredList.innerHTML = sims.map(s => `
        <div class="flex items-center justify-between py-2">
          <div class="text-sm">
            <div class="font-medium text-gray-800">${s.name}</div>
            <div class="text-xs text-gray-500">${s.host}</div>
          </div>
          <div>
            <button class="px-3 py-1 text-sm rounded-full bg-blue-50 text-blue-600 touchable" data-host="${s.host}">Add</button>
          </div>
        </div>
      `).join('');
      discoveredList.querySelectorAll('button[data-host]').forEach(b => {
        b.addEventListener('click', () => {
          const h = b.getAttribute('data-host');
          const hosts = JSON.parse(localStorage.getItem('hosts') || '[]');
          hosts.unshift({ id: Date.now(), host: h });
          localStorage.setItem('hosts', JSON.stringify(hosts));
          const toast = document.createElement('div');
          toast.textContent = '✅ Host added: ' + h;
          toast.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 bg-black/80 text-white px-4 py-2 rounded';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 1600);
        });
      });
    });

    document.getElementById('btnBack').addEventListener('click', () => history.back());
    document.getElementById('btnAdd').addEventListener('click', () => hostInput.focus());
  </script>
</body>
</html>
