<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>现代化通用后台管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 移除全局过渡（会导致移动端卡顿），只对少数元素使用过渡 */
    :root { --accent: #2563eb; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .soft-transition { transition: background-color .18s ease, color .18s ease; }

    /* 更友好的触摸目标 */
    .touch-btn { padding: .75rem 1rem; border-radius: .625rem; font-size: 1rem; }

    /* 减少动效（尊重用户偏好） */
    @media (prefers-reduced-motion: reduce) {
      .soft-transition { transition: none; }
    }

    /* 简单容器宽度限制，移动端更舒适 */
    .container-max { max-width: 960px; margin-inline: auto; padding: 0 16px; }

    /* 登录错误/提示 */
    .msg { font-size: 0.95rem; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="container-max min-h-screen flex items-center justify-center py-8">
    <div id="app" class="w-full max-w-lg">
      <!-- Login section -->
      <section id="loginSection" class="bg-white rounded-lg shadow p-6">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-semibold">🔐 管理后台</h1>
          <p class="text-sm text-gray-500">快速、流畅的手机登录体验</p>
        </div>

        <form id="loginForm" class="space-y-4">
          <div>
            <label class="text-sm font-medium">管理员账号</label>
            <input id="usernameInput" type="text" autocomplete="username" inputmode="text"
                   placeholder="请输入管理员账号 (示例: feiji)"
                   class="w-full mt-2 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                   required />
          </div>

          <div>
            <label class="text-sm font-medium">管理员密码</label>
            <input id="passwordInput" type="password" autocomplete="current-password" inputmode="text"
                   placeholder="请输入密码 (示例: 888888)"
                   class="w-full mt-2 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                   required />
          </div>

          <div class="flex items-center justify-between">
            <label class="inline-flex items-center text-sm">
              <input id="rememberMe" type="checkbox" class="mr-2" />
              记住我
            </label>

            <button id="btnSetPin" type="button" class="text-sm text-blue-600 hover:underline">设置快速 PIN</button>
          </div>

          <div class="flex gap-3">
            <button id="btnLogin" type="submit" class="flex-1 touch-btn bg-blue-600 text-white font-medium soft-transition">登录</button>
            <button id="btnUsePin" type="button" class="touch-btn border border-gray-200 text-gray-700">PIN</button>
          </div>

          <div id="loginMsg" class="mt-2 text-sm text-red-600 msg" aria-live="polite" style="display:none"></div>
        </form>

        <div class="mt-6 p-3 bg-gray-50 rounded text-xs text-gray-600">
          <div>测试账号：<strong>feiji</strong> / 密码：<strong>888888</strong></div>
          <div class="mt-1">快速 PIN 是可选的，PIN 会以 SHA-256 哈希形式存储在本地（非明文）。</div>
        </div>
      </section>

      <!-- Main section (hidden by default) -->
      <section id="mainSection" class="hidden bg-white rounded-lg shadow p-4 mt-6">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-semibold">📊 管理后台</h2>
            <div class="text-xs text-gray-500">欢迎</div>
          </div>
          <div class="flex items-center gap-2">
            <button id="btnLock" class="touch-btn border border-gray-200 text-gray-700">锁定</button>
            <button id="btnLogout" class="touch-btn bg-red-600 text-white">退出</button>
          </div>
        </div>

        <!-- 简化的主界面预览（使用静态 DOM，避免频繁重绘） -->
        <div id="mainContent" class="space-y-4">
          <div class="bg-gray-50 p-3 rounded">
            <div class="text-sm text-gray-600">作品与会员管理（移动优化预览）</div>
            <div class="mt-2 grid grid-cols-1 gap-3">
              <div class="p-3 bg-white rounded border">作品：3（示例）</div>
              <div class="p-3 bg-white rounded border">会员：4（示例）</div>
            </div>
          </div>

          <div>
            <button id="btnOpenWorks" class="w-full touch-btn bg-green-600 text-white">打开作品管理</button>
          </div>
        </div>
      </section>

      <!-- PIN modal (simple) -->
      <div id="pinModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center">
        <div class="bg-white rounded-lg p-4 w-11/12 max-w-sm">
          <h3 class="font-medium mb-2">设置 / 输入 快速 PIN</h3>
          <div id="pinStep" class="space-y-3">
            <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                   placeholder="请输入 4-6 位数字 PIN"
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg" />
            <div class="flex gap-2">
              <button id="pinSave" class="flex-1 touch-btn bg-blue-600 text-white">保存 PIN</button>
              <button id="pinCancel" class="flex-1 touch-btn border border-gray-200">取消</button>
            </div>
            <div id="pinMsg" class="text-sm text-red-600" style="display:none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 简化 DOM 更新：只切换隐藏/显示，避免大量 innerHTML 重新渲染
    const loginSection = document.getElementById('loginSection');
    const mainSection = document.getElementById('mainSection');
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginMsg = document.getElementById('loginMsg');
    const rememberMe = document.getElementById('rememberMe');
    const btnSetPin = document.getElementById('btnSetPin');
    const btnUsePin = document.getElementById('btnUsePin');
    const pinModal = document.getElementById('pinModal');
    const pinInput = document.getElementById('pinInput');
    const pinSave = document.getElementById('pinSave');
    const pinCancel = document.getElementById('pinCancel');
    const pinMsg = document.getElementById('pinMsg');
    const btnLogout = document.getElementById('btnLogout');
    const btnLock = document.getElementById('btnLock');

    // helpers
    function showMsg(el, text, isError=true) {
      el.style.display = text ? 'block' : 'none';
      el.textContent = text || '';
      el.style.color = isError ? '#dc2626' : '#075985';
    }

    async function hashText(text) {
      // 使用 SubtleCrypto 做 SHA-256 哈希
      if (!window.crypto || !crypto.subtle) {
        // 回退：简单 JS 哈希（弱），但大多数现代手机浏览器支持 SubtleCrypto
        return text.split('').map(c => c.charCodeAt(0).toString(16)).join('');
      }
      const data = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // 存取 localStorage 的 key
    const KEY_AUTH = 'admin_auth_v1'; // 用于记住登录
    const KEY_PIN = 'admin_fastpin_v1'; // 存储 pin 的哈希

    // 静态示例管理员账号（前端演示用）
    const ADMIN_USER = 'feiji';
    const ADMIN_PW = '888888';

    // 检查已有登录或 PIN
    (async function init() {
      try {
        const auth = localStorage.getItem(KEY_AUTH);
        const hasPin = !!localStorage.getItem(KEY_PIN);

        if (auth === 'true') {
          // 自动登录（记住我）
          showMain();
          return;
        }

        // 小优化：如果设备支持 autofill，聚焦输入框以唤起键盘
        setTimeout(() => usernameInput.focus(), 200);

        // 显示 / 隐藏 PIN 按钮
        btnUsePin.style.display = hasPin ? 'inline-flex' : 'none';
      } catch (e) {
        console.error('初始化失败', e);
      }
    })();

    // 登录处理（示例：前端静态校验）
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.style.display = 'none';
      const user = usernameInput.value.trim();
      const pw = passwordInput.value.trim();
      if (!user || !pw) { showMsg(loginMsg, '请输入账��和密码'); return; }

      // 真实项目请用后端认证；这里只是示例/本地演示
      if (user === ADMIN_USER && pw === ADMIN_PW) {
        // 登录成功
        if (rememberMe.checked) localStorage.setItem(KEY_AUTH, 'true');
        showMain();
      } else {
        showMsg(loginMsg, '账号或密码错误');
      }
    });

    // 快速 PIN：弹窗保存
    btnSetPin.addEventListener('click', () => {
      pinModal.classList.remove('hidden');
      pinModal.style.display = 'flex';
      pinInput.value = '';
      pinMsg.style.display = 'none';
      setTimeout(() => pinInput.focus(), 100);

      // 恢复保存行为
      pinSave.onclick = null;
    });

    pinCancel.addEventListener('click', () => {
      pinModal.classList.add('hidden');
    });

    pinSave.addEventListener('click', async () => {
      const pin = (pinInput.value || '').trim();
      if (!/^[0-9]{4,6}$/.test(pin)) {
        showMsg(pinMsg, '请输入 4-6 位数字 PIN');
        return;
      }
      const h = await hashText(pin);
      localStorage.setItem(KEY_PIN, h);
      pinModal.classList.add('hidden');
      btnUsePin.style.display = 'inline-flex';
      showMsg(loginMsg, '已保存快速 PIN（本地存储）', false);
      setTimeout(() => showMsg(loginMsg, ''), 2200);
    });

    // 使用 PIN 登录（弹出 PIN 输入框）
    btnUsePin.addEventListener('click', async () => {
      pinModal.classList.remove('hidden');
      pinModal.style.display = 'flex';
      pinInput.value = '';
      pinMsg.style.display = 'none';
      setTimeout(() => pinInput.focus(), 100);

      // 把保存动作改为校验
      pinSave.onclick = async () => {
        const pin = (pinInput.value || '').trim();
        if (!/^[0-9]{4,6}$/.test(pin)) {
          showMsg(pinMsg, '请输入 4-6 位数字 PIN');
          return;
        }
        const h = await hashText(pin);
        const stored = localStorage.getItem(KEY_PIN);
        if (h === stored) {
          // 成功
          pinModal.classList.add('hidden');
          // 登录并记住（短期会话）
          localStorage.setItem(KEY_AUTH, 'true');
          showMain();
        } else {
          showMsg(pinMsg, 'PIN 不匹配');
        }
      };
    });

    // 锁定：隐藏主界面，保留 PIN 登录（不会清除 PIN）
    btnLock.addEventListener('click', () => {
      localStorage.removeItem(KEY_AUTH); // 需重新解锁
      mainSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
      showMsg(loginMsg, '已锁定，请重新登录');
    });

    // 退出登录：清除所有本地凭据
    btnLogout.addEventListener('click', () => {
      localStorage.removeItem(KEY_AUTH);
      // 不删除 PIN：用户可能希望保留快速 PIN；如果想彻底清除也可以提供一个选项
      mainSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
      showMsg(loginMsg, '已退出登录', false);
    });

    function showMain() {
      loginSection.classList.add('hidden');
      mainSection.classList.remove('hidden');
      // 解除可能的错误提示
      showMsg(loginMsg, '');
    }

    // 防止 modal 因点击遮罩关闭时出现滚动问题
    pinModal.addEventListener('click', (e) => {
      if (e.target === pinModal) {
        pinModal.classList.add('hidden');
      }
    });

    // 简单快速键盘支持：在 PIN 模式按回车也提交
    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') pinSave.click();
    });
  </script>
</body>
</html>
