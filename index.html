<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代化通用后台管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            transition: all 0.3s ease;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .sidebar-nav button:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        
        table tbody tr:hover {
            background-color: #f9fafb;
        }
        
        .form-input:focus {
            border-color: rgb(59, 130, 246);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        // 应用状态管理
        const AppState = {
            isLoggedIn: false,
            password: '',
            activeTab: 'works',
            works: [
                { id: 1, title: "Next.js 15 全栈实战视频", author: "张三", coverUrl: "https://via.placeholder.com/150" },
                { id: 2, title: "Tailwind CSS 极速布局技巧", author: "李四", coverUrl: "https://via.placeholder.com/150" },
                { id: 3, title: "TypeScript 从入门到精通", author: "王五", coverUrl: "https://via.placeholder.com/150" }
            ],
            members: [
                { id: 1, username: "Alice", email: "alice@example.com", joinDate: "2026-06-01" },
                { id: 2, username: "Bob", email: "bob@example.com", joinDate: "2026-06-05" },
                { id: 3, username: "Charlie", email: "charlie@example.com", joinDate: "2026-07-10" },
                { id: 4, username: "Diana", email: "diana@example.com", joinDate: "2026-08-01" }
            ],
            newTitle: '',
            newAuthor: '',
            newCover: ''
        };

        // 事件处理器
        const handlers = {
            handleLogin: (e) => {
                e.preventDefault();
                if (AppState.password === 'admin123') {
                    AppState.isLoggedIn = true;
                    render();
                } else {
                    alert('❌ 密码错误！正确密码是：admin123');
                }
            },

            handleLogout: () => {
                if (confirm('确定要退出登录吗？')) {
                    AppState.isLoggedIn = false;
                    AppState.password = '';
                    render();
                }
            },

            handleAddWork: (e) => {
                e.preventDefault();
                if (!AppState.newTitle.trim() || !AppState.newAuthor.trim()) {
                    alert('⚠️ 请填写完整的作品信息！');
                    return;
                }

                const newWork = {
                    id: Date.now(),
                    title: AppState.newTitle,
                    author: AppState.newAuthor,
                    coverUrl: AppState.newCover || 'https://via.placeholder.com/150'
                };

                AppState.works.unshift(newWork);
                AppState.newTitle = '';
                AppState.newAuthor = '';
                AppState.newCover = '';
                alert('✅ 作品上传成功！');
                render();
            },

            handleDeleteWork: (id) => {
                if (confirm('确定要删除这个作品吗？')) {
                    AppState.works = AppState.works.filter(work => work.id !== id);
                    alert('✅ 作品已删除！');
                    render();
                }
            },

            setPassword: (value) => {
                AppState.password = value;
            },

            setNewTitle: (value) => {
                AppState.newTitle = value;
            },

            setNewAuthor: (value) => {
                AppState.newAuthor = value;
            },

            setNewCover: (value) => {
                AppState.newCover = value;
            },

            setActiveTab: (tab) => {
                AppState.activeTab = tab;
                render();
            }
        };

        // 登录界面
        const LoginPage = () => `
            <div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
                <div class="w-full max-w-md">
                    <div class="bg-white rounded-lg shadow-xl p-8">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-bold text-gray-900 mb-2">🔐 管理后台</h1>
                            <p class="text-gray-600">现代化通用后台管理系统</p>
                        </div>

                        <form onsubmit="handlers.handleLogin(event)">
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">管理员密码</label>
                                <input
                                    type="password"
                                    placeholder="请输入密码 (提示: admin123)"
                                    value="${AppState.password}"
                                    oninput="handlers.setPassword(this.value)"
                                    class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>

                            <button
                                type="submit"
                                class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors"
                            >
                                登录系统
                            </button>
                        </form>

                        <div class="mt-6 p-4 bg-blue-50 rounded-lg">
                            <p class="text-sm text-blue-800">
                                <strong>💡 测试密码：</strong> admin123
                            </p>
                        </div>

                        <div class="mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <p class="text-xs text-gray-600 mb-2"><strong>📋 系统特性：</strong></p>
                            <ul class="text-xs text-gray-600 space-y-1">
                                <li>✓ 作品上传与管理</li>
                                <li>✓ 会员信息查看</li>
                                <li>✓ 数据动态操作</li>
                                <li>✓ 响应式界面设计</li>
                            </ul>
                        </div>
                    </div>

                    <div class="mt-4 text-center text-sm text-gray-600">
                        <p>现代化后台管理系统 © 2026</p>
                    </div>
                </div>
            </div>
        `;

        // 主界面
        const MainPage = () => `
            <div class="min-h-screen bg-gray-50 flex">
                <!-- 侧边栏 -->
                <aside class="w-64 bg-white border-r border-gray-200">
                    <div class="p-6">
                        <h1 class="text-2xl font-bold text-gray-900 mb-2">📊 管理后台</h1>
                        <p class="text-sm text-gray-600 mb-8">现代化通用后台管理系统</p>

                        <nav class="sidebar-nav space-y-2">
                            <button
                                onclick="handlers.setActiveTab('works')"
                                class="w-full text-left px-4 py-2 rounded-lg font-medium transition-all ${
                                    AppState.activeTab === 'works'
                                        ? 'bg-blue-50 text-blue-600 border-l-4 border-blue-600'
                                        : 'text-gray-700 hover:bg-gray-100'
                                }"
                            >
                                🎬 作品管理
                            </button>
                            <button
                                onclick="handlers.setActiveTab('members')"
                                class="w-full text-left px-4 py-2 rounded-lg font-medium transition-all ${
                                    AppState.activeTab === 'members'
                                        ? 'bg-blue-50 text-blue-600 border-l-4 border-blue-600'
                                        : 'text-gray-700 hover:bg-gray-100'
                                }"
                            >
                                👥 会员管理
                            </button>
                        </nav>
                    </div>

                    <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-gray-50 to-transparent border-t border-gray-200">
                        <button
                            onclick="handlers.handleLogout()"
                            class="w-full bg-red-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-red-700 transition-colors text-sm"
                        >
                            🚪 退出登录
                        </button>
                    </div>
                </aside>

                <!-- 主内容区域 -->
                <main class="flex-1 p-8 overflow-auto">
                    ${AppState.activeTab === 'works' ? WorksPage() : MembersPage()}
                </main>
            </div>
        `;

        // 作品管理页面
        const WorksPage = () => `
            <div>
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">作品上传与管理</h2>
                    <p class="text-gray-600">管理和发布在线教程和学习资源</p>
                </div>

                <!-- 上传表单 -->
                <form onsubmit="handlers.handleAddWork(event)" class="bg-white rounded-lg shadow p-6 mb-8">
                    <h3 class="text-lg font-semibold text-gray-900 mb-6">📤 上传新作品</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">作品标题 *</label>
                            <input
                                type="text"
                                value="${AppState.newTitle}"
                                oninput="handlers.setNewTitle(this.value)"
                                placeholder="输入作品标题"
                                class="form-input w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">作者名称 *</label>
                            <input
                                type="text"
                                value="${AppState.newAuthor}"
                                oninput="handlers.setNewAuthor(this.value)"
                                placeholder="输入作者名称"
                                class="form-input w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">封面URL</label>
                            <input
                                type="text"
                                value="${AppState.newCover}"
                                oninput="handlers.setNewCover(this.value)"
                                placeholder="可选，留空使用默认"
                                class="form-input w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>
                    </div>
                    <div class="mt-4">
                        <button
                            type="submit"
                            class="bg-green-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-green-700 transition-colors"
                        >
                            ✨ 上传作品
                        </button>
                    </div>
                </form>

                <!-- 作品列表 -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-900">作品列表 (共 ${AppState.works.length} 个)</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">ID</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">作品标题</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">作者</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">封面</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">操作</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                ${AppState.works.map(work => `
                                    <tr>
                                        <td class="px-6 py-4 text-sm text-gray-600">${work.id}</td>
                                        <td class="px-6 py-4 text-sm font-medium text-gray-900">${work.title}</td>
                                        <td class="px-6 py-4 text-sm text-gray-600">${work.author}</td>
                                        <td class="px-6 py-4">
                                            <a href="${work.coverUrl}" target="_blank" class="text-blue-600 hover:underline text-sm">
                                                查看图片
                                            </a>
                                        </td>
                                        <td class="px-6 py-4 text-sm">
                                            <button
                                                onclick="handlers.handleDeleteWork(${work.id})"
                                                class="text-red-600 hover:text-red-800 hover:underline font-medium"
                                            >
                                                🗑️ 删除
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;

        // 会员管理页面
        const MembersPage = () => `
            <div>
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">注册会员管理</h2>
                    <p class="text-gray-600">查看和管理系统中的所有注册会员</p>
                </div>

                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-900">会员列表 (共 ${AppState.members.length} 位)</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">会员ID</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">用户名</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">邮箱</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">注册时间</th>
                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">状态</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                ${AppState.members.map((member, index) => `
                                    <tr>
                                        <td class="px-6 py-4 text-sm text-gray-600">${member.id}</td>
                                        <td class="px-6 py-4 text-sm font-medium text-gray-900">${member.username}</td>
                                        <td class="px-6 py-4 text-sm text-gray-600">${member.email}</td>
                                        <td class="px-6 py-4 text-sm text-gray-600">${member.joinDate}</td>
                                        <td class="px-6 py-4 text-sm">
                                            <span class="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-medium">
                                                ✓ 活跃
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="text-center">
                            <div class="text-3xl font-bold text-blue-600 mb-2">${AppState.members.length}</div>
                            <div class="text-gray-600">总会员数</div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="text-center">
                            <div class="text-3xl font-bold text-green-600 mb-2">${AppState.members.length}</div>
                            <div class="text-gray-600">活跃会员</div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="text-center">
                            <div class="text-3xl font-bold text-purple-600 mb-2">${AppState.works.length}</div>
                            <div class="text-gray-600">发布作品数</div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // 渲染函数
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = AppState.isLoggedIn ? MainPage() : LoginPage();
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
